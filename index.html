<title>Ryggsäcken – allt du behöver för skoluppgifterna</title>
<style>

:root{
  --surface:#fff; --hdr:rgba(245,242,234,.96); --chip:#e9e3d6; color-scheme:light;
  --sans:"Atkinson Hyperlegible",Verdana,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; --serif:Georgia,Cambria,"Times New Roman",serif;
  --paper:#f5f2ea; --card:#fffdf8; --ink:#1d2731; --muted:#5b6672; --line:#e0d9ca;
  --accent:#2c6a59; --accent-ink:#ffffff; --accent-soft:#e2eee8; --accent-line:#b9d6ca;
  --warn:#9a4d24; --warn-soft:#fbeee4;
  --who:#fde0bf; --when:#d3e7fb; --what:#e6dbf8; --where:#d5efda;
  --radius:12px;
}
*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid #e0a03a;outline-offset:2px}

/* Header */
header.top{position:sticky;top:0;z-index:20;background:var(--hdr);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-inner{max-width:1180px;margin:0 auto;padding:.7rem 1.2rem;display:flex;flex-wrap:wrap;gap:.8rem 1.4rem;align-items:center}
.brand{display:flex;align-items:center;gap:.6rem;margin-right:auto}
.brand-mark{width:40px;height:40px;flex:none;line-height:0}.brand-mark svg{display:block}
.brand h1{font-size:1.25rem}
.brand small{display:block;color:var(--muted);font-size:.8rem;font-family:var(--sans)}
.controls{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center}
.ctl{display:flex;align-items:center;gap:.4rem;font-size:.88rem;color:var(--muted)}
.ctl select{padding:.35rem .5rem;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:2px}
.seg button{border:0;background:transparent;padding:.3rem .8rem;border-radius:999px;cursor:pointer;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:.3rem .55rem;cursor:pointer;font-size:.85rem}

/* Layout */
.wrap{max-width:1180px;margin:0 auto;padding:1.4rem 1.2rem 4rem;display:grid;grid-template-columns:260px 1fr;gap:1.6rem;align-items:start}
nav.steps{position:sticky;top:84px}
nav.steps ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
nav.steps button{width:100%;text-align:left;display:flex;gap:.65rem;align-items:center;border:1px solid transparent;background:transparent;border-radius:10px;padding:.5rem .6rem;cursor:pointer}
nav.steps button:hover{background:var(--card);border-color:var(--line)}
nav.steps button[aria-current="step"]{background:var(--card);border-color:var(--accent-line);box-shadow:0 1px 0 var(--line)}
.num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;font-weight:700;background:var(--chip);color:var(--ink)}
button[aria-current="step"] .num{background:var(--accent);color:var(--accent-ink)}
.done .num{background:var(--accent-soft);color:var(--accent)}
.nav-text{display:flex;flex-direction:column;line-height:1.25}
.nav-text b{font-weight:700;font-size:.95rem}
.nav-text span{font-size:.78rem;color:var(--muted)}
.progress{margin-top:1rem;font-size:.85rem;color:var(--muted)}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:.35rem}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.4rem 1.5rem;margin-bottom:1.1rem}
.step-head{display:flex;gap:1rem;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.eyebrow{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700}
.step-head h2{font-size:1.75rem;margin-top:.15rem}
.lead{font-size:1.08rem;color:var(--ink);margin:.8rem 0 0;max-width:62ch}
h3{font-size:1.1rem;margin-bottom:.6rem}
.how{margin:0;padding-left:1.3rem}
.how li{margin:.35rem 0}

/* checklist */
.check{list-style:none;margin:0;padding:0;display:grid;gap:.35rem}
.check label{display:flex;gap:.65rem;align-items:flex-start;padding:.45rem .6rem;border-radius:8px;cursor:pointer}
.check label:hover{background:var(--paper)}
.check input{width:1.15rem;height:1.15rem;margin-top:.2rem;accent-color:var(--accent);flex:none}
.check input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:#b5ad9c}

/* notes */
textarea.notes{width:100%;min-height:130px;border:1px solid var(--line);border-radius:10px;padding:.75rem .85rem;background:var(--surface);resize:vertical;line-height:1.55}
.hint{font-size:.85rem;color:var(--muted)}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:.45rem .95rem;cursor:pointer;font-weight:700;font-size:.92rem}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:.25rem .6rem;font-size:.82rem;font-weight:400}

/* program tips */
.tips{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius) var(--radius) 0;padding:1rem 1.2rem}
.tips h3{display:flex;align-items:center;gap:.5rem}
.prog-badge{font-family:var(--sans);font-size:.75rem;background:var(--accent);color:var(--accent-ink);padding:.1rem .5rem;border-radius:99px}
.tips dl{margin:0;display:grid;grid-template-columns:minmax(130px,max-content) 1fr;gap:.45rem 1rem}
.tips dt{font-weight:700}
.tips dd{margin:0}
kbd{font-family:inherit;font-size:.82em;background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 .3rem}
.path{background:var(--surface);border:1px solid var(--accent-line);border-radius:6px;padding:0 .35rem;white-space:nowrap}

/* generic tables / grids */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem}
.mini{border:1px solid var(--line);border-radius:10px;padding:.8rem .95rem;background:var(--surface)}
.mini b{display:block;margin-bottom:.2rem}
.mini p{margin:.2rem 0;font-size:.95rem}
table.verbs{width:100%;border-collapse:collapse;font-size:.95rem}
table.verbs td{padding:.45rem .5rem;border-top:1px solid var(--line);vertical-align:top}
table.verbs td:first-child{font-weight:700;width:30%}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.weak{border-left:4px solid var(--warn);background:var(--warn-soft);padding:.7rem .9rem;border-radius:0 10px 10px 0}
.good{border-left:4px solid var(--accent);background:var(--accent-soft);padding:.7rem .9rem;border-radius:0 10px 10px 0}
.ladder{display:flex;flex-direction:column;gap:.35rem}
.ladder div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.45rem .7rem}
.ladder div:nth-child(2){margin-left:1.2rem}.ladder div:nth-child(3){margin-left:2.4rem;border-color:var(--accent);background:var(--accent-soft)}
.template{display:grid;gap:.5rem;counter-reset:part}
.template .part{display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.65rem .85rem}
.template .part::before{counter-increment:part;content:counter(part);grid-row:span 2;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:.85rem}
.template .part b{font-size:1rem}
.template .part span{color:var(--muted);font-size:.93rem}
.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.6rem}
.chip{display:inline-block;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:.05rem .55rem;margin:.15rem .15rem 0 0;font-size:.9rem}
.callout{background:var(--warn-soft);border:1px solid #efcfb8;border-radius:10px;padding:.75rem .95rem;font-size:.95rem}

/* reference generator */
.gen-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.7rem}
.field{display:flex;flex-direction:column;gap:.2rem}
.field label{font-size:.85rem;font-weight:700}
.field small{font-size:.78rem;color:var(--muted)}
.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:8px;padding:.45rem .6rem;background:var(--surface)}
.field textarea{min-height:64px;resize:vertical}
.field.wide{grid-column:1/-1}
.types{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.types button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:.3rem .8rem;cursor:pointer}
.types button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.output{margin-top:1rem;display:grid;gap:.7rem}
.outbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.75rem .9rem}
.outbox .lbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.outbox .ref{margin-top:.3rem;font-size:1.02rem;word-break:break-word}
.hang{padding-left:2em;text-indent:-2em}
.k-who{background:var(--who)}.k-when{background:var(--when)}.k-what{background:var(--what)}.k-where{background:var(--where)}
.plain .k-who,.plain .k-when,.plain .k-what,.plain .k-where{background:none}
.legend{display:flex;flex-wrap:wrap;gap:.4rem .9rem;font-size:.85rem;align-items:center}
.legend span i{display:inline-block;width:.9em;height:.9em;border-radius:3px;vertical-align:-.1em;margin-right:.3rem}
.reflist{list-style:none;padding:0;margin:0;display:grid;gap:.4rem}
.reflist li{display:flex;gap:.6rem;align-items:flex-start;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.5rem .7rem}
.reflist li .ref{flex:1}
.x{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:1.1rem;line-height:1}
.empty{color:var(--muted);font-style:italic}

/* source evaluation */
.crit{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.7rem}
.crit .mini select{width:100%;margin-top:.35rem;border:1px solid var(--line);border-radius:8px;padding:.35rem .5rem;background:var(--surface)}
.srcs{display:grid;gap:.5rem;margin-top:.8rem}
.src{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;display:flex;justify-content:space-between;gap:.6rem}
.src .marks{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.25rem}
.mark{font-size:.8rem;border-radius:99px;padding:0 .5rem;border:1px solid var(--line)}
.mark.ok{background:var(--accent-soft);border-color:var(--accent-line)}
.mark.unsure{background:#fff6d9;border-color:#ecd98f}
.mark.bad{background:var(--warn-soft);border-color:#efcfb8}

.pager{display:flex;justify-content:space-between;gap:1rem;margin-top:.5rem}
.toast{max-width:90vw;text-align:center;position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%) translateY(150%);background:var(--ink);color:var(--paper);padding:.6rem 1.1rem;border-radius:99px;transition:transform .25s;z-index:50;font-size:.92rem}
.toast.show{transform:translateX(-50%) translateY(0)}
footer{max-width:1180px;margin:0 auto;padding:0 1.2rem 2rem;color:var(--muted);font-size:.85rem}
#exportBox{width:100%;min-height:260px;font-family:ui-monospace,Menlo,monospace;font-size:.85rem}

.overlay{position:fixed;inset:0;background:rgba(20,28,36,.45);display:grid;place-items:center;z-index:40;padding:1rem}
.overlay[hidden]{display:none}
.panel{background:var(--card);border-radius:14px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:1.3rem 1.5rem;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.4rem}
.panel h2{font-size:1.4rem}.panel h3{margin-top:1.2rem}
.panel ul{padding-left:1.2rem}.panel li{margin:.35rem 0}
.panel textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:.6rem .75rem;background:var(--surface);font-size:.88rem}
.panel details{margin-top:1.2rem;background:var(--paper);border-radius:10px;padding:.6rem .9rem}
.panel summary{cursor:pointer;font-weight:700}
.radio{display:flex;gap:.55rem;align-items:flex-start;padding:.35rem 0;cursor:pointer}
.radio input{margin-top:.3rem;accent-color:var(--accent)}
.banner{background:var(--surface);border:1px solid var(--accent-line);border-left:4px solid var(--accent);border-radius:0 12px 12px 0;padding:.8rem 1rem;margin-bottom:1.1rem;display:flex;gap:1rem;justify-content:space-between;align-items:flex-start;font-size:.95rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:.6rem;margin-top:1rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.55rem .8rem}
.stat b{display:block;font-size:1.4rem;font-family:Georgia,serif}
.stat span{font-size:.8rem;color:var(--muted)}
.res{border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem;background:var(--surface);margin-top:.7rem}
.res h4{margin:0 0 .3rem;font-size:1.02rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.res ul{margin:.3rem 0 0;padding-left:1.2rem}.res li{margin:.2rem 0}
.res p{margin:.25rem 0}
.badge{font-size:.75rem;border-radius:99px;padding:.05rem .55rem;font-weight:700;font-family:var(--sans)}
.badge.ok{background:var(--accent-soft);color:var(--accent)}
.badge.tip{background:#fff3cc;color:#6d5200}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line)}
.chip.off{opacity:.5}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem 1.2rem;max-height:520px;overflow:auto;line-height:1.8;margin-top:.6rem}
.preview p{margin:0 0 .8rem}
.preview .ph{font-weight:700;font-family:Georgia,serif}
mark.hl-long{background:#fff0a8;color:inherit}
.hl-cite{background:var(--when);border-radius:3px}
.hl-miss{background:#ffd4c2;border-bottom:2px dashed var(--warn);border-radius:3px}
.hl-quote{background:#f3dcff;border-radius:3px}
.no-long mark.hl-long{background:none}.no-cite .hl-cite,.no-cite .hl-miss{background:none;border:0}.no-quote .hl-quote{background:none}
.toggles{display:flex;flex-wrap:wrap;gap:.3rem 1.1rem;font-size:.9rem;margin-top:.6rem}
.toggles label{display:flex;gap:.35rem;align-items:center;cursor:pointer}
.toggles i{display:inline-block;width:.9em;height:.9em;border-radius:3px}
textarea#gtext{min-height:220px}
.numin{width:6.5rem;border:1px solid var(--line);border-radius:8px;padding:.35rem .5rem;background:var(--surface)}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  nav.steps{position:static}
  nav.steps ol{flex-direction:row;overflow-x:auto;padding-bottom:.4rem}
  nav.steps li{flex:none}
  nav.steps button{width:auto}
  .nav-text span{display:none}
  .compare{grid-template-columns:1fr}
  .tips dl{grid-template-columns:1fr}
  .tips dt{margin-top:.4rem}
}
@media print{header.top,nav.steps,.pager{display:none}.wrap{display:block}}
.en{display:block;color:var(--muted);font-size:.9em;font-style:italic;margin-top:.15rem}
.enblock{margin-top:.6rem;font-style:normal}
.enblock .how{font-style:italic}
.gl{color:var(--muted);font-size:.85em;font-style:italic}
.linkbtn{border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0;font:inherit}
.iconbtn.active{background:var(--accent-soft);border-color:var(--accent-line);font-weight:700}
.lockic{font-size:.85em}
.taskbar{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:10px;padding:.5rem .9rem;margin-bottom:1rem;font-size:.95rem}
.taskcard{border-color:var(--accent-line);border-width:2px}
.taskcard .instr{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem;margin-top:.6rem;white-space:normal}
.taskcard .meta{font-size:.92rem;color:var(--ink)}
table.matrix{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:.4rem}
table.matrix th,table.matrix td{border:1px solid var(--line);padding:.45rem .55rem;vertical-align:top;text-align:left;background:var(--surface)}
table.matrix thead th{background:var(--paper)}
table.plan{width:100%;border-collapse:collapse;font-size:.95rem;margin-top:.7rem}
table.plan td{padding:.4rem .5rem;border-top:1px solid var(--line)}
table.plan td:nth-child(2){white-space:nowrap;font-weight:700}
table.plan tr.done td{color:var(--muted)}
table.plan tr.late td:last-child{color:var(--warn);font-weight:700}
table.plan tr.now{background:#fff6d9}
nav.steps button.late .nav-text span{color:var(--warn)}
.panel.wide{max-width:900px}
.panel .search,.search{width:100%;border:1px solid var(--line);border-radius:8px;padding:.45rem .6rem;background:var(--surface);margin:.5rem 0}
.glosslist{margin:0}
.glosslist div{padding:.45rem 0;border-top:1px solid var(--line)}
.glosslist dt{font-weight:700}
.glosslist dd{margin:.1rem 0 0}
.term{border-bottom:2px dotted var(--accent);cursor:help}
.term:hover,.term:focus{background:var(--accent-soft)}
#gtip{position:absolute;z-index:45;background:var(--ink);color:var(--paper);border-radius:10px;padding:.6rem .8rem;font-size:.92rem;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#gtip .gl{color:#cfd8de}
.stepchecks{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 1rem}
.mrow{border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;margin:.5rem 0;background:var(--surface)}

.mpara{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem}

.mlabel{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700}

/* ---------- dark theme ---------- */

  --paper:#13181d; --card:#1b2229; --surface:#222b33; --ink:#e4e8eb; --muted:#a2acb6; --line:#34404a; --chip:#2c3740;
  --accent:#62b89f; --accent-ink:#0e1a16; --accent-soft:#1d3830; --accent-line:#2e5a4c;

}
[data-theme="dark"] .callout{border-color:#5a3f2e}
[data-theme="dark"] .mark.unsure,[data-theme="dark"] table.plan tr.now{background:#3a331b}

<script id="app">
const PRISTINE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

async function copyRich(html, text){
  try {
    if (html!==null && window.ClipboardItem && navigator.clipboard?.write) {
      await navigator.clipboard.write([new ClipboardItem({'text/html': new Blob([html],{type:'text/html'}), 'text/plain': new Blob([text],{type:'text/plain'})})]);
      toast('Kopierat – klistra in i ditt dokument'); return;
    }
  } catch(e) {}
  try { await navigator.clipboard.writeText(text); toast('Kopierat (utan kursiv stil)'); return; } catch(e) {}
  const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  ta.remove(); toast(ok ? 'Kopierat' : 'Kunde inte kopiera – markera texten och tryck Ctrl+C');
}


/* ---------- text types ---------- */
const TEXTSORTS = {
  arg:{name:'Argumenterande text', parts:[
    ['Inledning','Väck intresse, presentera ämnet och skriv din tes – vad du tycker.'],
    ['Argument 1','Ditt starkaste eller tydligaste argument, med förklaring och belägg.'],
    ['Argument 2','Ett nytt argument – gärna ur ett annat perspektiv.'],
    ['Argument 3 (valfritt)','Ytterligare ett argument, med exempel eller källa.'],
    ['Motargument och bemötande','Vad skulle någon som tycker annorlunda säga? Varför håller du ändå fast vid din tes?'],
    ['Avslutning','Sammanfatta, upprepa tesen med andra ord och avsluta med en uppmaning eller tanke.']]},
  utr:{name:'Utredande text', parts:[
    ['Inledning','Presentera ämnet, syftet och frågeställningen.'],
    ['Bakgrund','Det läsaren behöver veta för att förstå frågan.'],
    ['Perspektiv/aspekt 1','Redogör för en del av frågan, med källor.'],
    ['Perspektiv/aspekt 2','Redogör för en annan del eller ett annat synsätt.'],
    ['Diskussion','Jämför, väg för- och nackdelar och dra egna slutsatser.'],
    ['Avslutning','Besvara frågeställningen kort och tydligt.']]},
  rap:{name:'Vetenskaplig rapport', parts:[
    ['Inledning','Bakgrund, syfte och frågeställning(ar).'],
    ['Metod','Hur du har gått till väga – så att någon annan skulle kunna göra om det.'],
    ['Resultat','Vad du kom fram till, sakligt redovisat (gärna med tabeller/diagram). Inga egna åsikter här.'],
    ['Diskussion','Tolka resultatet, jämför med källor och diskutera felkällor.'],
    ['Slutsats','Kort svar på frågeställningen.'],
    ['Referenser','Alla källor du har hänvisat till.']]},
  ana:{name:'Analys', parts:[
    ['Inledning','Presentera verket/fenomenet och vad du ska undersöka.'],
    ['Kort beskrivning','Sammanfatta det läsaren behöver veta – inte mer.'],
    ['Analys','Undersök delarna: t.ex. tema, personer, miljö, språk, stilmedel, bildspråk.'],
    ['Tolkning','Vad betyder det? Stöd dina tolkningar med citat eller exempel.'],
    ['Avslutning','Knyt ihop: vad har analysen visat?']]},
  pm:{name:'PM', parts:[
    ['Inledning','Syfte, frågeställning och kort bakgrund.'],
    ['Avhandling','Redogör för ämnet utifrån dina källor, uppdelat i underrubriker.'],
    ['Analys/diskussion','Jämför källorna, dra slutsatser och ta ställning där det passar.'],
    ['Avslutning','Sammanfatta och besvara frågeställningen.'],
    ['Referenser','Alla källor du har hänvisat till.']]}
};

/* ---------- steps ---------- */
const STEPS = [
{ id:'uppgift', title:'Förstå uppgiften', short:'Vad ska jag göra?',

  extra:'start',
  check:['Jag vet vilken textsort jag ska skriva','Jag vet vem som är mottagare','Jag har strukit under instruktionsverben','Jag vet längd, formalia och deadline','Jag har läst bedömningsmatrisen'],
  note:'Skriv med egna ord: Vad ska jag göra? Till vem? Hur långt? När ska det vara klart?',
  tips:{
    docs:[['Skapa dokumentet','Gå till Drive → <span class="path">Ny → Google Dokument</span>. Klicka på ”Namnlöst dokument” och ge det ett tydligt namn direkt.'],['Dela med läraren','Klicka på <span class="path">Dela</span> uppe till höger – eller skapa dokumentet direkt från uppgiften i Classroom.']],
    word:[['Skapa dokumentet','<span class="path">Arkiv → Nytt → Tomt dokument</span>. Spara direkt i OneDrive (<span class="path">Arkiv → Spara som</span>) och ge filen ett tydligt namn.'],['Spara automatiskt','Slå på <span class="path">Spara automatiskt</span> uppe till vänster så försvinner inget arbete.']]}
},
{ id:'ideer', title:'Idéer och avgränsning', short:'Vad ska jag skriva om?',
  lead:'Ett för brett ämne ger en tunn text. Ju snävare du avgränsar ämnet, desto djupare kan du gå.',
  how:['Skriv ner allt du vet om ämnet i en tankekarta – sortera inte än.','Ringa in det som intresserar dig mest.','Formulera en frågeställning (eller tes) som går att besvara inom textens längd.','Skriv syftet i en mening: ”Syftet med texten är att …”'],
  extra:'narrow',
  check:['Jag har brainstormat kring ämnet','Jag har avgränsat ämnet','Jag har en frågeställning eller tes','Jag har formulerat ett syfte'],
  note:'Min frågeställning eller tes – och mitt syfte:',
  tips:{

    word:[['Tankekarta','Gör tankekartan på papper, i ett verktyg som Whiteboard eller Canva, eller som en punktlista i dokumentet. Med <kbd>Tab</kbd> och <kbd>Skift</kbd>+<kbd>Tab</kbd> ändrar du nivå på punkterna.']]}
},
{ id:'kallor', title:'Källor och källkritik', short:'Var hittar jag fakta?',
  lead:'Bra källor gör din text trovärdig. Värdera varje källa innan du använder den – och skriv upp den direkt när du hittar den.',
  how:['Börja brett: uppslagsverk (t.ex. NE), läroböcker och myndigheters webbplatser.','Sök smalt: använd sökord från din frågeställning, prova synonymer och engelska ord.','Använd skolans databaser och fråga bibliotekarien.','Skriv upp författare, år, titel och länk direkt – annars hittar du aldrig källan igen.'],
  extra:'kallkritik',
  check:['Jag har minst tre relevanta källor','Jag har värderat mina källor','Jag har sparat allt jag behöver till referenserna','Jag har källor med olika perspektiv'],
  note:'Mina sökord och var jag har letat:',
  tips:{
    docs:[['Spara källorna','Lägg en egen sida längst bak i dokumentet där du klistrar in länkar och uppgifter.'],['Citatverktyget','<span class="path">Verktyg → Citat</span> låter dig lägga in källor medan du söker. Det stöder APA, MLA och Chicago – inte Harvard, Oxford, Vancouver eller IEEE.']],
    word:[['Hantera källor','<span class="path">Referenser → Hantera källor</span> – lägg in källor medan du söker, så finns de när du ska referera.'],['Länkar och datum','Klistra in länken och skriv upp dagens datum – det behövs för webbkällor i Harvard och Oxford.']]}
},
{ id:'disposition', title:'Disposition', short:'Hur ska texten byggas?',
  lead:'En disposition är textens skelett. Med en tydlig plan blir skrivandet mycket lättare – du vet alltid vad nästa stycke ska handla om.',
  how:['Välj textsort uppe i menyn så visas en passande mall.','Skriv några stödord för varje del: vad ska den delen handla om?','Bestäm vilka källor du använder var.','Kontrollera att varje del hjälper dig att svara på frågeställningen.'],
  extra:'template',
  check:['Jag har valt en disposition','Varje del har en tydlig uppgift','Jag vet vilka källor jag använder var','Inledning och avslutning hänger ihop'],
  note:'Min disposition – stödord för varje del:',
  tips:{
    docs:[['Disposition som rubriker','Skriv delarna som rubriker (<span class="path">Rubrik 1</span>, <span class="path">Rubrik 2</span>). Då syns de i dokumentdispositionen: <span class="path">Visa → Visa disposition</span>.']],
    word:[['Disposition som rubriker','Skriv delarna med formatmallarna <span class="path">Rubrik 1</span> och <span class="path">Rubrik 2</span>. Visa dem i <span class="path">Visa → Navigeringsfönster</span> och dra för att flytta hela avsnitt.']]}
},

const EMBED = window.SKRIVSTOD_UPPGIFT || null;

const KEY = 'skrivstodet-v1' + (EMBED ? '-' + hashStr(JSON.stringify(EMBED)) : '');

function load(){ for (const st of [()=>sessionStorage, ()=>localStorage]) { try { const raw = st().getItem(KEY); if (raw) return JSON.parse(raw); } catch(e) {} } return null; }
let state = Object.assign({}, defaults, fresh(), load() || {});
if (typeof state.step === 'number' && !load()?.stepId) state.stepId = (STEPS[state.step]||STEPS[0]).id; // from version 2

  const data = JSON.stringify(state);
  try {
    if (state.storage==='session') { sessionStorage.setItem(KEY, data); try{ localStorage.removeItem(KEY); }catch(e){} }
    else { localStorage.setItem(KEY, data); try{ sessionStorage.removeItem(KEY); }catch(e){} }
  } catch(e) {}
}

const pad = n => String(n).padStart(2,'0');
const fmtISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => fmtISO(new Date());
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const WD_SV = ['sön','mån','tis','ons','tor','fre','lör'], WD_EN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtShort = d => `${(isEn()?WD_EN:WD_SV)[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`;
const PLAN_W = {uppgift:1, ideer:1, kallor:2, disposition:1, utkast:4, referera:1, granska:1, bearbeta:2, formalia:1, slutkoll:1};
function buildPlan(){
  const dl = deadline(); if (!dl) return null;
  const start = state.planStart || todayISO();
  const a = parseD(start), b = parseD(dl);
  if (b < parseD(todayISO())) return {past:true, dl};
  if (b < a) return {startAfter:true, past:true, dl};
  const days = [];
  for (let d = new Date(a); d <= b; d.setDate(d.getDate()+1)) { const wd = d.getDay(); if (!state.planWeekends && (wd===0 || wd===6)) continue; days.push(new Date(d)); }
  if (!days.length || +days[days.length-1] !== +b) days.push(new Date(b));
  const steps = visSteps(), tot = steps.reduce((x,s)=>x+PLAN_W[s.id], 0); let cum = 0; const map = {};
  steps.forEach((s,i) => { cum += PLAN_W[s.id]; const idx = i===steps.length-1 ? days.length-1 : Math.max(0, Math.ceil(cum/tot*days.length)-1); map[s.id] = days[idx]; });
  return {map, dl, start, n:days.length};
}

const S = (t,k,i) => ({t:String(t),k:k||null,i:!!i});
function parseAuthors(str){
  return (str||'').split('\n').map(x=>x.trim()).filter(Boolean).map(line=>{
    if (line.includes(',')) { const [l,...f]=line.split(','); return {last:l.trim(), first:f.join(',').trim()}; }
    const p=line.split(/\s+/); return p.length>1 ? {last:p.pop(), first:p.join(' ')} : {last:line, first:''};
  });
}
const initials = f => f ? f.split(/\s+/).filter(Boolean).map(p=>p.split('-').map(x=>x[0].toUpperCase()+'.').join('-')).join(' ') : '';
function joinList(arr, last){ if(arr.length<2) return arr.join(''); return arr.slice(0,-1).join(', ') + last + arr[arr.length-1]; }

function whoFor(sys, f){
  const a = parseAuthors(f.authors);
  if (!a.length) return {list:f.org||'', cite:f.org||'', fn:f.org||'', bib:f.org||'', none:!f.org};
  const ini = a.map(x=> x.first ? `${x.last}, ${initials(x.first)}` : x.last);
  const full = a.map(x=> x.first ? `${x.first} ${x.last}` : x.last);
  const citeAmp = a.length===1 ? a[0].last : a.length===2 ? `${a[0].last} & ${a[1].last}` : `${a[0].last} et al.`;
  const citeOch = a.length===1 ? a[0].last : a.length===2 ? `${a[0].last} och ${a[1].last}` : `${a[0].last} et al.`;
  const bibFirst = a[0].first ? `${a[0].last}, ${a[0].first}` : a[0].last;
  return {
    list: sys==='apa' ? (a.length===1 ? ini[0] : joinList(ini, ', & ')) : joinList(ini, ' och '),
    cite: sys==='apa' ? citeAmp : citeOch,
    fn: a.length>3 ? `${full[0]} m.fl.` : joinList(full, ' och '),
    bib: a.length>3 ? `${bibFirst} m.fl.` : joinList([bibFirst, ...full.slice(1)], ' och '),
    none:false
  };
}
const ord = n => /[12]$/.test(n) && !/1[12]$/.test(n) ? n+':a' : n+':e';
const endDot = s => /[.!?]$/.test(s) ? '' : '.';

function buildRef(sys, type, f, num){
  if (!['apa','harvard','oxford'].includes(sys)) return buildRefMore(sys, type, f, num);
  const W = whoFor(sys, f), y = f.year?.trim() || 'u.å.', title = f.title?.trim() || 'Titel saknas';
  const acc = f.accessed ? `hämtad ${f.accessed}` : '';
  const e = [], c = []; let note = '';
  const P = (...x) => e.push(...x);

    const who = W.none ? null : W.list;
    const head = () => who ? [S(who,'who'), S(who.endsWith('.')?' (':'. ('), S(y,'when'), S('). ')] : null;
    const titleFirst = (italic) => [S(title,'what',italic), S('. ('), S(y,'when'), S('). ')];
    if (type==='web'){
      P(...(head()||titleFirst(true))); if (who) P(S(title,'what',true), S('. '));
      if (f.site && f.site!==who) P(S(f.site,'where'), S('. '));
      if (f.url) P(S(f.url,'where'));
    } else if (type==='book'){
      P(...(head()||titleFirst(true))); if (who) P(S(title,'what',true));
      if (f.edition && f.edition!=='1') P(S(` (${ord(f.edition)} uppl.)`)); if (who) P(S('. '));
      if (f.publisher) P(S(f.publisher,'where'), S('.'));
    } else if (type==='article'){
      P(...(head()||titleFirst(false))); if (who) P(S(title,'what'), S(endDot(title)+' '));
      if (f.journal){ P(S(f.journal,'where',true)); if (f.volume) P(S(', '), S(f.volume,'where',true)); if (f.issue) P(S(`(${f.issue})`,'where')); if (f.pages) P(S(', '+f.pages,'where')); P(S('. ')); }
      if (f.doi) P(S(f.doi,'where'));
    } else if (type==='video'){
      P(...(head()||titleFirst(true))); if (who) P(S(title,'what',true)); P(S(' [Video]. '));
      if (f.platform) P(S(f.platform,'where'), S('. ')); if (f.url) P(S(f.url,'where'));
    } else if (type==='ai'){
      const org = f.org || 'Företag';
      P(S(org,'who'), S('. ('), S(y,'when'), S('). '), S(title,'what',true));
      if (f.version) P(S(` (${f.version})`)); P(S(' [Stor språkmodell]. ')); if (f.url) P(S(f.url,'where'));
      note = 'Beskriv gärna i texten vad du frågade AI-verktyget och hur du använde svaret.';
    }
    const cw = type==='ai' ? (f.org||'Företag') : (W.none ? `”${title}”` : W.cite);
    c.push(S('('), S(cw,'who'), S(', '), S(y,'when'), S(')'));

    const who = W.none ? title : W.list;
    const head = [S(who, W.none?'what':'who'), S(' ('), S(y,'when'), S('). ')];
    const tail = () => { if (f.url) { P(S('Tillgänglig via: '), S(f.url,'where')); if (acc) P(S(` (${acc})`)); P(S('.')); } };
    P(...head);
    if (type==='web'){ if(!W.none) P(S(title,'what',true), S('. ')); if (f.site && f.site!==who) P(S(f.site,'where'), S('. ')); tail(); }
    else if (type==='book'){ if(!W.none) P(S(title,'what',true), S('. ')); if (f.edition && f.edition!=='1') P(S(`${ord(f.edition)} uppl. `)); if (f.place) P(S(f.place,'where'), S(': ')); if (f.publisher) P(S(f.publisher,'where'), S('.')); }
    else if (type==='article'){ if(!W.none) P(S(title,'what'), S(endDot(title)+' ')); if (f.journal){ P(S(f.journal,'where',true)); if (f.volume) P(S(', '+f.volume,'where')); if (f.issue) P(S(`(${f.issue})`,'where')); if (f.pages) P(S(', s. '+f.pages,'where')); P(S('. ')); } if (f.doi) P(S(f.doi,'where')); }
    else if (type==='video'){ if(!W.none) P(S(title,'what',true)); P(S(' [video]. ')); if (f.platform) P(S(f.platform,'where'), S('. ')); tail(); }
    else if (type==='ai'){ e.length=0; P(S(f.org||'Företag','who'), S(' ('), S(y,'when'), S('). '), S(title,'what',true)); if (f.version) P(S(` [${f.version}]`)); P(S('. ')); tail(); }
    const cw = type==='ai' ? (f.org||'Företag') : (W.none ? `”${title}”` : W.cite);
    c.push(S('('), S(cw,'who'), S(' '), S(y,'when'), S(')'));
    note = 'Harvard finns i flera varianter – vissa skolor skriver komma efter namnet: (Svensson, 2024). Följ den variant din lärare vill ha. Lägg till sidnummer vid citat: (Svensson 2024, s. 12).';
  }

    const fnWho = type==='ai' ? (f.org||'Företag') : W.fn, bibWho = type==='ai' ? (f.org||'Företag') : W.bib;
    const body = (who, isFn) => {
      const o=[]; const Q=(...x)=>o.push(...x);
      if (who) Q(S(who,'who'), S(', '));
      if (type==='book'){
        Q(S(title,'what',true));
        if (isFn){ Q(S(' (')); if (f.place) Q(S(f.place,'where'), S(': ')); if (f.publisher) Q(S(f.publisher,'where'), S(', ')); Q(S(y,'when'), S('), s. __.')); }
        else { if (f.publisher) Q(S(', '), S(f.publisher,'where')); if (f.place) Q(S(', '), S(f.place,'where')); Q(S(', '), S(y,'when'), S('.')); }
      } else if (type==='article'){
        Q(S(`”${title}”`,'what'), S(', '));
        if (f.journal) Q(S(f.journal,'where',true)); if (f.volume) Q(S(`, vol. ${f.volume}`,'where')); if (f.issue) Q(S(`, nr ${f.issue}`,'where'));
        Q(S(' ('), S(y,'when'), S(')')); if (f.pages) Q(S(`, s. ${f.pages}`,'where')); if (f.doi) Q(S(', '), S(f.doi,'where')); Q(S('.'));
      } else {
        if (type==='web') Q(S(`”${title}”`,'what')); else Q(S(title,'what',true));
        if (type==='ai' && f.version) Q(S(` (${f.version})`));
        if (type==='web' && f.site && f.site!==who) Q(S(', '), S(f.site,'where'));
        if (type==='video' && f.platform) Q(S(', '), S(f.platform,'where'));

        if (f.url) Q(S(', '), S(f.url,'where')); if (acc) Q(S(` (${acc})`)); Q(S('.'));
      }
      return o;
    };
    c.push(S('¹ '), ...body(W.none && type!=='ai' ? '' : fnWho, true));

  }
  [e,c].forEach(a=>{ const l=a[a.length-1], p=a[a.length-2]; if(l&&p&&l.t==='.'&&p.t.endsWith('.')) a.pop(); });
  return {entry:e, cite:c, note};
}

const isoParts = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m ? {y:+m[1], m:+m[2]-1, d:+m[3]} : null; };
const ordEn = n => { const x = +n; if (!x) return n; const s = (x%100>=11 && x%100<=13) ? 'th' : ({1:'st',2:'nd',3:'rd'}[x%10] || 'th'); return x+s; };
const noProto = u => String(u||'').replace(/^https?:\/\//,'');
function buildRefMore(sys, type, f, num){

  const full = a => a.first ? `${a.first} ${a.last}` : a.last;

  const org = (f.org||'').trim(); let note = '';
  const N = String(num || 1);

    let who = '';

    else if (org && type!=='ai') who = org;
    const acc = isoParts(f.accessed); const accS = acc ? `Accessed ${acc.d} ${MON_MLA[acc.m]} ${acc.y}.` : '';
    if (who) P(S(who,'who'), S(who.endsWith('.')?' ':'. '));
    if (type==='book'){ P(S(title,'what',true), S('. ')); if (f.edition && f.edition!=='1') P(S(`${ordEn(f.edition)} ed., `)); if (f.publisher) P(S(f.publisher,'where')); if (y) P(S(f.publisher?', ':''), S(y,'when')); P(S('.')); }
    else if (type==='article'){ P(S(`“${title}.”`,'what'), S(' ')); if (f.journal) P(S(f.journal,'where',true)); if (f.volume) P(S(`, vol. ${f.volume}`,'where')); if (f.issue) P(S(`, no. ${f.issue}`,'where')); if (y) P(S(', '), S(y,'when')); if (f.pages) P(S(`, pp. ${f.pages}`,'where')); P(S('.')); if (f.doi) P(S(' '), S(f.doi,'where'), S('.')); }
    else if (type==='web'){ P(S(`“${title}.”`,'what'), S(' ')); if (f.site && f.site!==who) P(S(f.site,'where',true), S(', ')); if (y) P(S(y,'when'), S(', ')); if (f.url) P(S(noProto(f.url),'where')); P(S('.')); if (accS) P(S(' '+accS)); }
    else if (type==='video'){ P(S(`“${title}.”`,'what'), S(' ')); if (f.platform) P(S(f.platform,'where',true)); if (org && A.length) P(S(`, uploaded by ${org}`)); if (y) P(S(', '), S(y,'when')); if (f.url) P(S(', '), S(noProto(f.url),'where')); P(S('.')); }
    else if (type==='ai'){ P(S('“Description of your prompt” prompt. ')); P(S(title,'what',true), S(', ')); if (f.version) P(S(`${f.version} version, `)); P(S(org||'Company','who')); if (y) P(S(', '), S(y,'when')); if (f.url) P(S(', '), S(noProto(f.url),'where')); P(S('.')); note = 'mla-ai'; }
    const cw = A.length===1 ? A[0].last : A.length===2 ? `${A[0].last} and ${A[1].last}` : A.length>2 ? `${A[0].last} et al.` : (type==='ai' || !org ? `“${title.split(/\s+/).slice(0,3).join(' ')}”` : org);
    c.push(S('('), S(cw, cw.startsWith('“')?'what':'who'), S(')'));
  }
  else if (sys==='chicago'){
    const acc = f.accessed ? `hämtad ${f.accessed}` : '', yy = y || 'u.å.';
    const fnWho = A.length>3 ? `${full(A[0])} m.fl.` : joinList(A.map(full), ' och ');
    const bibWho = A.length ? (A.length===1 ? inv(A[0]) : `${inv(A[0])}${A.length>2?', ':' och '}${joinList(A.slice(1).map(full), ' och ')}`) : '';
    const whoN = type==='ai' ? '' : (fnWho || org), whoB = type==='ai' ? (org||'Företag') : (bibWho || org);
    // footnote
    if (type==='ai'){ c.push(S('¹ Text genererad av '), S(title,'what',true)); if (f.version) c.push(S(` (${f.version})`)); c.push(S(', '), S(org||'Företag','who'), S(', '), S(yy,'when')); if (f.url) c.push(S(', '), S(f.url,'where')); c.push(S('.')); }
    else {
      c.push(S('¹ ')); if (whoN) c.push(S(whoN,'who'), S(', '));

/* ---------- local language check (heuristic rules, nothing leaves the browser) ---------- */
const NB = '(?<![\\p{L}])', NA = '(?![\\p{L}])';
const LANG_RULES = [
  {id:'double', re:new RegExp(NB+'(\\p{L}+)\\s+\\1'+NA,'giu'),
    sv:'Samma ord två gånger i rad.', en:'The same word twice in a row.'},
  {id:'dem', re:new RegExp(NB+'dem\\s+(?:är|var|har|hade|kan|kunde|ska|skulle|vill|ville|måste|gör|gjorde|tycker|tyckte|tror|trodde|säger|sa|sade|får|fick|blir|blev|kommer|kom|går|gick|vet|visste|brukar|behöver|borde|bor|heter|menar|anser)'+NA,'giu'),
    pick:'first', sv:'Kanske <b>de</b>? Före ett verb, när de gör något, skriver man oftast <i>de</i> (som engelskans <i>they</i>).', en:'Maybe <b>de</b>? Before a verb, when they do something, Swedish usually uses <i>de</i> (like English <i>they</i>).'},
  {id:'de', re:new RegExp(NB+'(?:för|till|med|av|på|om|åt|hos|mot|från|utan|efter|bland|mellan|framför|bakom|kring|runt|såg|ser|hjälpa|hjälper|hjälpte|frågade|frågar|ringde|ringer|träffade|träffar|gillar|gillade|älskar|hatar|känner|kände|ger|gav|visade|tackade|mötte|följde|stoppade)\\s+de(?=\\s*[.,!?;:)]|\\s*$|\\s+(?:själva|också|inte|alla|båda)'+NA+')','giu'),
    pick:'last', sv:'Kanske <b>dem</b>? När någon gör något med dem skriver man <i>dem</i> (som engelskans <i>them</i>).', en:'Maybe <b>dem</b>? When something is done to them, Swedish uses <i>dem</i> (like English <i>them</i>).'},
  {id:'dom', re:new RegExp(NB+'dom'+NA,'giu'),
    sv:'<i>Dom</i> är talspråk. Skriv <i>de</i> eller <i>dem</i> i en skoltext.', en:'<i>Dom</i> is spoken language. Write <i>de</i> or <i>dem</i> in a school text.'},
  {id:'vart', re:new RegExp(NB+'vart(?:\\s+\\p{L}+)?\\s+(?:är|bor|finns|ligger|står|sitter|befinner|bodde|låg|fanns|stod|satt|hittar|hittade)'+NA,'giu'),
    pick:'first', sv:'Kanske <b>var</b>? <i>Var</i> frågar om en plats (Var bor du?). <i>Vart</i> frågar om riktning (Vart ska du åka?).', en:'Maybe <b>var</b>? <i>Var</i> asks about a place (Where do you live?). <i>Vart</i> asks about direction (Where are you going?).'},
  {id:'var', re:new RegExp(NB+'var(?:\\s+\\p{L}+)?\\s+(?:åker|åkte|reser|reste|flyttar|flyttade|springer|sprang|cyklar|cyklade|flyger|flög|tar vägen|tog vägen)'+NA,'giu'),
    pick:'first', sv:'Kanske <b>vart</b>? <i>Vart</i> används om riktning, när någon förflyttar sig.', en:'Maybe <b>vart</b>? <i>Vart</i> is used for direction, when someone moves somewhere.'},
  {id:'spacebefore', re:/[^\S\n]+(?=[,.!?;:](?!\d))/g,
    sv:'Mellanslag före skiljetecken. Ta bort mellanslaget.', en:'A space before a punctuation mark. Remove the space.'},
  {id:'spaceafter', re:/(?<=\p{Ll}{2,})[,.!?;:](?=\p{Lu}\p{Ll})|(?<=\p{L}),(?=\p{L})/gu,
    sv:'Mellanslag saknas efter skiljetecknet.', en:'A space is missing after the punctuation mark.'},
  {id:'doublespace', re:/(?<=\S) {2,}(?=\S)/g,
    sv:'Dubbla mellanslag.', en:'Double spaces.'}

const CAPS_RULE = {id:'caps', sv:'Meningen börjar med liten bokstav.', en:'The sentence starts with a lower-case letter.'};
function langCheck(textParas){
  const found = [];
  textParas.forEach(p=>{
    LANG_RULES.forEach(rule=>{ rule.re.lastIndex = 0; let m; while ((m = rule.re.exec(p.text))) { let i0 = m.index, l0 = Math.max(m[0].length,1);
      if (rule.pick==='first'){ l0 = m[0].match(/^\p{L}+/u)[0].length; }
      if (rule.pick==='last'){ const w = m[0].match(/\p{L}+$/u)[0]; i0 = m.index + m[0].length - w.length; l0 = w.length; }
      found.push({rule, text:p.text, i:i0, len:l0}); if (m[0].length===0) rule.re.lastIndex++; } });
    const prot = p.text.replace(ABBR, m=>m.replace(/\./g,'․'));
    const RC = /(?:^|[.!?][”"')]?\s+)[”"'(]?(\p{Ll})/gu; let mc;
    while ((mc = RC.exec(prot))) { const pos = mc.index + mc[0].length - 1; found.push({rule:CAPS_RULE, text:p.text, i:pos, len:1}); }
  });
  return found;
}
function ctx(f){ const a = Math.max(0, f.i-30), b = Math.min(f.text.length, f.i+f.len+30);

function markInline(html, A){
  html = html.replace(/([”"“])([^”"“<]{12,400})([”"])/g, m=>`<span class="hl-quote">${m}</span>`);
  if (A.kind==='num'){
    const re = state.refsys==='ieee' ? /\[(\d+(?:\s*[–,-]\s*\d+)*)\]/g : /\((\d+(?:\s*[–,-]\s*\d+)*)\)/g;
    return html.replace(re, (m,inner)=>{ const ns = inner.split(/[–,-]/).map(x=>+x.trim()); return `<span class="${ns.every(n=>n>=1&&n<=A.nums.count)?'hl-cite':'hl-miss'}">${m}</span>`; });
  }
  if (A.kind==='name'){
    return html.replace(/\((\p{Lu}[\p{L}-]+)(?:\s(?:and|och|&amp;)\s\p{Lu}[\p{L}-]+|\set al\.)?(?:,?\s\d+(?:[–-]\d+)?)?\)/gu, (m,name)=>`<span class="${A.refs.some(r=>r.key===keyOf(name))?'hl-cite':'hl-miss'}">${m}</span>`);
  }
  if (!A.oxford){
    const ok = c => A.refs.some(r=>r.key===c.key && r.year===c.year);
    html = html.replace(RE_NARR, (m,name,year)=>`<span class="${ok({key:keyOf(name),year})?'hl-cite':'hl-miss'}">${m}</span>`);
    html = html.replace(/\(([^()<]{2,160}?)\)/g, (m,inner)=>{
      const pieces = inner.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').split(';').map(p=>p.trim().replace(/^(se även|se|jfr|t\.ex\.)\s+/i,'').match(RE_PIECE)).filter(Boolean);
      if (!pieces.length) return m;
      return `<span class="${pieces.every(p=>ok({key:keyOf(p[1]),year:p[2]}))?'hl-cite':'hl-miss'}">${m}</span>`;
    });
  }
  return html;
}
function renderPreview(A){
  // language findings are marked on the raw paragraph first (private-use markers), then escaped and decorated
  return A.paras.map(p=>{
    if (p.head) return `<p class="ph">${escT(p.text)}</p>`;
    const asc = A.lang.filter(f=>f.text===p.text).sort((a,b)=>a.i-b.i), marks = []; let end = -1;
    asc.forEach(f=>{ if (f.i >= end) { marks.push(f); end = f.i + f.len; } });
    let raw = p.text;
    marks.reverse().forEach(f=>{ raw = raw.slice(0,f.i) + '' + raw.slice(f.i, f.i+f.len) + '' + raw.slice(f.i+f.len); });
    const sents = splitSentences(raw);
    const html = sents.map(s=>{ const h = markInline(escT(s), A); return wordsOf(s.replace(/[]/g,'')).length>LONG ? `<mark class="hl-long">${h}</mark>` : h; }).join(' ');
    return `<p>${html.replace(//g,'<span class="hl-lang">').replace(//g,'</span>')}</p>`;
  }).join('');
}

/* ---------- export & save code ---------- */
const CODE_KEYS = ['stepId','prog','textsort','refsys','checks','notes','refs','sources','wmin','wmax','self','task','deadline','planStart','planWeekends','plans','kk'];
function makeCode(){ const d={v:3}; CODE_KEYS.forEach(k=>d[k]=state[k]); return 'RYGGSÄCKEN-KOD:' + enc(d); }
function readCode(str){
  const m = String(str).match(/(?:SKRIVST[ÖO]DET|STEGVIS|RYGGS[ÄA]CKEN)-KOD:\s*([A-Za-z0-9+/=\s]+)/);
  if (!m) throw new Error('nocode');
  const d = dec(m[1]);
  if (d.step!==undefined && d.stepId===undefined) d.stepId = (STEPS[+d.step]||STEPS[0]).id;
  CODE_KEYS.forEach(k=>{ if (d[k]!==undefined) state[k]=d[k]; });
  ['refs','sources','plans','kk'].forEach(k=>{ if (!Array.isArray(state[k])) state[k]=[]; });
  ['checks','notes','self'].forEach(k=>{ if (!state[k] || typeof state[k]!=='object') state[k]={}; });
  if (EMBED) state.task = EMBED;
  if (!visSteps().some(s=>s.id===state.stepId)) state.stepId='uppgift';
  save();
}
function buildExport(){
  const L1 = [`${Lt('MIN SKRIVPLANERING','MY WRITING PLAN')} – ${TS(state.textsort).name}`];
  if (task()) L1.push(`${Lt('Uppgift','Task')}: ${task().name||''}${task().deadline?' · deadline '+task().deadline:''}`);
  L1.push('');
  STEPS.forEach((s,i)=>{ const n = state.notes[s.id]; if (n && n.trim()) L1.push(`${i+1}. ${stepTitle(s).toUpperCase()}`, n.trim(), ''); });
  if (state.sources.length){ L1.push(Lt('KÄLLVÄRDERING','SOURCE EVALUATION')); state.sources.forEach(s=>L1.push(`- ${s.name}: ${CRIT.map(([k,sv,en])=>`${Lt(sv,en)} ${MARK[s[k]]||'–'}`).join(', ')}`)); L1.push(''); }
  const m = matrix(), selfRows = m.rows.filter(r=>state.self[r.c] && (state.self[r.c].lvl!==undefined || state.self[r.c].why));
  if (selfRows.length){ L1.push(Lt('SJÄLVSKATTNING','SELF-ASSESSMENT')); selfRows.forEach(r=>{ const v=state.self[r.c]; L1.push(`- ${r.c}: ${v.lvl!==undefined && v.lvl!==null ? (m.levels[v.lvl]||'') : '–'}${v.why?' – '+v.why.trim():''}`); }); L1.push(''); }
  const refs = sortedRefs(); if (refs.length){ L1.push(listName(state.refsys).toUpperCase()); refs.forEach(r=>L1.push(segText(r.entry))); }
  if (L1.length<=3) L1.push(Lt('(Du har inte skrivit några anteckningar ännu.)','(You haven’t written any notes yet.)'));
  if (state.plans && state.plans.length){ L1.push('', Lt('MINA PLANERINGAR','MY PLANS')); state.plans.forEach(p=>L1.push(planText(p), '')); }
  const kkDone = (state.kk||[]).filter(s=>s.final);
  if (kkDone.length){ L1.push('', Lt('KÄLLKOLLEN','SOURCE CHECKS')); kkDone.forEach(s=>L1.push(`${s.name} – ${Lt(FINAL[s.final][0],FINAL[s.final][1]).slice(2)}`, motivFor(s), '')); }
  L1.push('', '—', Lt('Vill du fortsätta i Ryggsäcken senare, på vilken dator som helst? Kopiera raden nedan och klistra in den under ”Spara / fortsätt”.','Want to continue in Ryggsäcken later, on any computer? Copy the line below and paste it under “Save / continue”.'), makeCode());
  return L1.join('\n');
}

/* ---------- glossary in text ---------- */
let GLOSS_RE = null;
function glossify(root){
  if (!state.gloss || !root) return;
  GLOSS_RE = GLOSS_RE || GLOSS.map((g,i)=>({i, re:new RegExp('(?<![\\p{L}])('+g[1]+')(?![\\p{L}])','iu')}));
  const done = new Set();
  GLOSS_RE.forEach(({i,re})=>{
    if (done.has(i)) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n => n.parentElement.closest('.term,kbd,.path,button,.en,h2,.eyebrow,textarea,select,label,a') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
    let n; while ((n = walker.nextNode())) {
      const m = n.nodeValue.match(re); if (!m) continue;
      const span = document.createElement('span'); span.className='term'; span.tabIndex=0; span.setAttribute('role','button'); span.dataset.g=i; span.textContent=m[1];
      const after = n.splitText(m.index); after.nodeValue = after.nodeValue.slice(m[1].length); n.parentNode.insertBefore(span, after);
      done.add(i); break;
    }
  });
}
function showTip(el){
  const g = GLOSS[+el.dataset.g], tip = $('#gtip');
  tip.innerHTML = `<b>${esc(g[0])}</b> <span class="gl">${esc(g[3])}</span><br>${g[2]}`;
  tip.hidden = false; const r = el.getBoundingClientRect(), w = Math.min(300, window.innerWidth-20);
  tip.style.width = w+'px'; tip.style.left = Math.max(10, Math.min(r.left, window.innerWidth-w-10)) + 'px'; tip.style.top = (r.bottom + window.scrollY + 6) + 'px';
}
document.addEventListener('click', e=>{ const el = e.target.closest('.term'); if (el) { showTip(el); e.stopPropagation(); } else if (!e.target.closest('#gtip')) $('#gtip').hidden = true; });
document.addEventListener('keydown', e=>{ if ((e.key==='Enter'||e.key===' ') && e.target.classList?.contains('term')) { e.preventDefault(); showTip(e.target); } if (e.key==='Escape') $('#gtip').hidden = true; });

function schedule(p){
  if (!p.deadline) return null;
  const today = todayISO(), start = p.start || today;
  const a = parseD(start), b = parseD(p.deadline);
  if (b < a) return {err:'startAfter'};
  const days = [];
  for (let d = new Date(a); d <= b; d.setDate(d.getDate()+1)) { const wd = d.getDay(); if (!p.weekends && (wd===0 || wd===6)) continue; days.push(new Date(d)); }
  if (!days.length || +days[days.length-1] !== +b) days.push(new Date(b));
  // Steps finished before the start date (after "plan again") are left out of the spread.
  const active = p.items.map((_,i)=>i).filter(i=>!(p.items[i].done && p.items[i].dd && p.items[i].dd < start));
  const tot = active.reduce((x,i)=>x+(+p.items[i].w||1), 0) || 1; let cum = 0;
  const dates = p.items.map(it=>it.dd||'');
  active.forEach((i,k)=>{ cum += (+p.items[i].w||1); const idx = k===active.length-1 ? days.length-1 : Math.max(0, Math.ceil(cum/tot*days.length)-1); dates[i] = fmtISO(days[idx]); });
  return {dates, n:days.length, active:active.length, past: p.deadline < today};
}

/* focus timer – only in memory */
let tmr = null, tmEnd = 0;
function startTimer(min){ stopTimer(true); tmEnd = Date.now() + min*60000; tmr = setInterval(tick, 1000); tick(); }
function stopTimer(quiet){ if (tmr) clearInterval(tmr); tmr = null; const o = $('#tmOut'); if (o) o.textContent = ''; const s = $('#tmStop'); if (s) s.hidden = true; }
function tick(){
  const o = $('#tmOut'), s = $('#tmStop'); if (!tmr){ if (s) s.hidden = true; return; }
  const left = Math.max(0, Math.round((tmEnd - Date.now())/1000));
  if (o) o.textContent = `${Math.floor(left/60)}:${pad(left%60)}`; if (s) s.hidden = false;
  if (left <= 0){ stopTimer(); toast(Lt('⏰ Tiden är ute – ta en kort paus!','⏰ Time’s up – take a short break!')); }
}
function weekView(){
  const today = todayISO(), rows = [];
  state.plans.forEach(p=>{ const S = schedule(p); if (!S || S.err) return;
    p.items.forEach((it,i)=>{ if (S.dates[i]) rows.push({d:S.dates[i], t:it.t, done:it.done, key:p.id+'|'+i, name:p.name, icon:ptype(p).icon}); });
    if (p.deadline) rows.push({d:p.deadline, dl:true, name:p.name, sel:p.id}); });
  const P = buildPlan(), skrivName = (task() && task().name) || 'Skrivstödet';
  if (P && !P.past){ visSteps().forEach(s=>rows.push({d:fmtISO(P.map[s.id]), t:stepTitle(s), done:stepDone(s), skriv:s.id, name:skrivName, icon:'✍️'})); rows.push({d:P.dl, dl:true, name:skrivName, skrivDl:true}); }
  const head = toolHead('plan', Lt('Min vecka','My week'), L('Här ser du vad du ska göra de närmaste sju dagarna – från alla dina uppgifter. Bocka av när du är klar.','Here you can see what to do over the next seven days – from all your tasks. Tick things off when you are done.'));
  if (!rows.length) return head + `<div class="card"><h3>${L('Inget planerat än','Nothing planned yet')}</h3><p>${L('Lägg in ditt första prov eller din första uppgift, så delar vi upp den i små steg med datum.','Add your first test or task, and we will break it into small steps with dates.')}</p>
    <div class="row"><button class="btn" type="button" id="wkNew">＋ ${Lt('Ny uppgift','New task')}</button></div></div>`;
  const itemRow = r => r.dl
    ? `<li class="wdl">🏁 <b>${Lt('Deadline','Deadline')}:</b> ${r.sel?`<button class="linkbtn" type="button" data-wsel="${r.sel}">${esc(r.name)}</button>`:`<button class="linkbtn" type="button" data-wskriv="uppgift">${esc(r.name)}</button>`}</li>`
    : r.skriv
      ? `<li class="${r.done?'wdone':''}"><span class="wic" aria-hidden="true">${r.done?'✓':r.icon}</span><span><button class="linkbtn" type="button" data-wskriv="${r.skriv}">${esc(r.t)}</button> <span class="hint">· ${esc(r.name)}</span></span></li>`
      : `<li class="${r.done?'wdone':''}"><label><input type="checkbox" data-wk="${r.key}" ${r.done?'checked':''}><span>${esc(r.t)} <span class="hint">· ${r.icon} ${esc(r.name)}</span></span></label></li>`;
  const late = rows.filter(r=>!r.dl && !r.done && r.d < today);
  let html = head;
  if (late.length) html += `<div class="card"><h3>⚠ ${L('Efter planen','Behind the plan')}</h3><p class="hint">${Lt('Gör dem när du kan – eller öppna uppgiften och välj ”Planera om från idag”.','Do them when you can – or open the task and choose “Plan again from today”.')}</p><ul class="wlist">${late.map(itemRow).join('')}</ul></div>`;
  const days = [];
  for (let k=0; k<7; k++){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+k); const iso = fmtISO(d), list = rows.filter(r=>r.d===iso);
    days.push(`<div class="day ${k===0?'today':''}"><h4>${k===0?Lt('Idag','Today')+' · ':k===1?Lt('Imorgon','Tomorrow')+' · ':''}${esc(fmtShort(d))}</h4>${list.length?`<ul class="wlist">${list.map(itemRow).join('')}</ul>`:`<p class="empty">${Lt('Inget planerat','Nothing planned')}</p>`}</div>`); }
  const end = new Date(); end.setDate(end.getDate()+6); const later = rows.filter(r=>!r.dl && !r.done && r.d > fmtISO(end)).length;
  html += `<div class="card"><h3>${L('De närmaste sju dagarna','The next seven days')}</h3><div class="days">${days.join('')}</div>
    ${later?`<p class="hint" style="margin-top:.8rem">${Lt(`+ ${later} steg längre fram.`,`+ ${later} steps further ahead.`)}</p>`:''}</div>`;
  return html;
}

        <button class="btn ghost" type="button" id="kSend">${s.sent?'✓ ':''}✍️ ${s.sent?Lt('Uppdatera i Skrivstödet','Update in Skrivstödet'):Lt('Lägg till i Skrivstödets källor','Add to Skrivstödet’s sources')}</button></div>
      <div class="row" style="margin-top:1rem"><button class="btn ghost small" type="button" id="kNew">＋ ${Lt('Granska en ny källa','Check a new source')}</button><button class="btn ghost small" type="button" id="kDel">🗑 ${Lt('Ta bort källan','Delete the source')}</button></div>
      <div id="kDelConfirm" hidden class="callout" style="margin-top:.6rem">${Lt('Ta bort den här granskningen?','Delete this check?')}<div class="row" style="margin-top:.5rem"><button class="btn small" type="button" id="kDelYes">${Lt('Ja, ta bort','Yes, delete')}</button><button class="btn ghost small" type="button" id="kDelNo">${Lt('Avbryt','Cancel')}</button></div></div>`;
  } else {
    const Q = KK_Q[st.id], c = s.c[st.id] || [], f = Q.field;
    body = `<p class="lead" style="margin-top:0">${L(Q.lead[0],Q.lead[1])}</p>
      <h3 style="margin-top:1rem">${L('Har du kollat?','Have you checked?')}</h3>
      <ul class="check">${Q.checks.map(([sv,en],j)=>`<li><label><input type="checkbox" data-kc="${j}" ${c[j]?'checked':''}><span>${L(sv,en)}</span></label></li>`).join('')}</ul>
      ${st.id==='ber'?`<h3 style="margin-top:1rem">${L('Första eller andra hand?','First or second hand?')}</h3><div class="row">${Object.entries(HAND).map(([k,v])=>`<label class="radio"><input type="radio" name="khand" value="${k}" ${s.hand===k?'checked':''}><span>${Lt(v[0],v[1])}</span></label>`).join('')}</div>`:''}
      ${st.id==='ten'?`<h3 style="margin-top:1rem">${L('Vad vill källan främst?','What does the source mainly want?')}</h3><div class="row">${Object.entries(PURPOSES).map(([k,v])=>`<label class="radio"><input type="radio" name="kpur" value="${k}" ${s.purpose===k?'checked':''}><span>${Lt(v[0],v[1])}</span></label>`).join('')}</div>`:''}
      <div class="field" style="margin-top:.8rem"><label for="kField">${Lt(f[1],f[2])}</label><input id="kField" value="${esc(s.f[f[0]]||'')}" placeholder="${Lt(f[3],f[4])}"></div>
      <h3 style="margin-top:1.2rem">${Lt('Hur bedömer du','How do you rate')} ${Lt(st.crit[0],st.crit[1]).toLowerCase()}?</h3>
      <div class="verdicts">${Object.entries(VERD).map(([k,v])=>`<button type="button" data-verd="${k}" class="${k}" aria-pressed="${s.v[st.id]===k}">${v[0]} ${Lt(v[1],v[2])}</button>`).join('')}</div>
      ${tip}`;
  }
  return `<section class="card"><div class="eyebrow">🔎 Källkollen${s.name?' · '+esc(s.name):''}</div><h2>${esc(Lt(st.sv,st.en))}</h2>${st.crit?`<div class="hint">${Lt('Kriterium','Criterion')}: ${Lt(st.crit[0],st.crit[1])}</div>`:''}<div style="margin-top:.8rem">${pills}</div></section>
    <div class="card">${body}</div>
    <div class="pager">${i>0?`<button class="btn ghost" type="button" id="kPrev">← ${esc(Lt(KK_STEPS[i-1].sv,KK_STEPS[i-1].en))}</button>`:'<span></span>'}${i<KK_STEPS.length-1?`<button class="btn" type="button" id="kNext">${esc(Lt(KK_STEPS[i+1].sv,KK_STEPS[i+1].en))} →</button>`:''}</div>`;
}
function motivFor(s){
  if (s.motiv) return s.motiv;
  const en = isEn(), T = kkType(s), out = [], v = s.v, f = s.f;
  const name = s.name || (en ? 'the source' : 'källan');
  out.push(en ? `“${name}”${s.where?` (${s.where})`:''} is a source of the type ${T.en.toLowerCase()}.` : `Källan ”${name}”${s.where?` (${s.where})`:''} är av typen ${T.sv.toLowerCase()}.`);
  const who = f.who ? (en ? `It is published by ${f.who}. ` : `Avsändare är ${f.who}. `) : '';
  if (v.akt || who) out.push(who + ({ok:en?'The publisher is clear and seems credible.':'Avsändaren är tydlig och verkar trovärdig.', unsure:en?'It is not entirely clear who is behind the source.':'Det är inte helt tydligt vem som står bakom källan.', bad:en?'It is unclear who is behind the source, which makes it less credible.':'Det är oklart vem som står bakom källan, vilket gör den mindre trovärdig.'}[v.akt]||''));
  if (f.when) out.push((en ? `It was published or updated ${f.when}` : `Den publicerades eller uppdaterades ${f.when}`) + ({ok:en?' and the information is still up to date.':' och uppgifterna är fortfarande aktuella.', unsure:en?', but the information may have changed since then.':', men uppgifterna kan ha ändrats sedan dess.', bad:en?', so the information is probably out of date.':', så uppgifterna är troligen inaktuella.'}[v.tid]||'.'));
  else if (v.tid) out.push(en ? 'It is not clear when the source was published.' : 'Det framgår inte tydligt när källan publicerades.');
  const hand = s.hand==='first' ? (en?'It is a primary source. ':'Det är en förstahandskälla. ') : s.hand==='second' ? (en?'It is a secondary source. ':'Det är en andrahandskälla. ') : '';
  const conf = f.confirm ? (en ? `The information is confirmed by ${f.confirm}.` : `Uppgifterna bekräftas av ${f.confirm}.`) : (v.ber==='unsure'||v.ber==='bad') ? (en ? 'I have not found another source that confirms the information.' : 'Jag har inte hittat någon annan källa som bekräftar uppgifterna.') : '';
  if (hand || conf) out.push(hand + conf);
  const pur = {inf:en?'The source mainly wants to inform':'Källan vill främst informera', over:en?'The source wants to persuade the reader, so it may be one-sided':'Källan vill övertyga läsaren, så den kan vara vinklad', salj:en?'The source wants to sell something, which may affect what it highlights':'Källan vill sälja något, vilket kan påverka vad den lyfter fram', und:en?'The source mainly wants to entertain':'Källan vill främst underhålla'}[s.purpose];
  if (pur || f.missing) out.push((pur ? pur + (f.missing ? (en?'. ':'. ') : '.') : '') + (f.missing ? (en ? `A perspective that is missing is ${f.missing}.` : `Ett perspektiv som saknas är ${f.missing}.`) : ''));
  const fin = s.final || suggestFinal(s);
  out.push({use:en?'Overall, I judge the source to be credible and usable.':'Sammantaget bedömer jag att källan är trovärdig och kan användas.',
    care:en?'Overall, I judge that the source can be used, but with care – I check important information against other sources.':'Sammantaget bedömer jag att källan kan användas, men med försiktighet – viktiga uppgifter kontrollerar jag mot andra källor.',
    no:en?'Overall, I judge that the source should not be used as a source of facts.':'Sammantaget bedömer jag att källan inte bör användas som faktakälla.'}[fin]);
  return out.join(' ');
}
function wireKk(s){
  const i = KK_STEPS.findIndex(x=>x.id===s.step), st = KK_STEPS[i];
  const goK = id => { s.step = id; save(); renderKk(); window.scrollTo({top:0}); };
  const nameOk = () => { if (s.step==='vad' && !s.name.trim()){ toast(Lt('Skriv källans namn först','Write the name of the source first')); $('#kName').focus(); return false; } return true; };
  document.querySelectorAll('[data-kstep]').forEach(b=>b.onclick=()=>{ if (nameOk()) goK(b.dataset.kstep); });
  $('#kPrev')?.addEventListener('click', ()=>goK(KK_STEPS[i-1].id));
  $('#kNext')?.addEventListener('click', ()=>{ if (nameOk()) goK(KK_STEPS[i+1].id); });
  const dirty = () => { s.motiv = null; save(); };
  if (st.id==='vad'){
    $('#kName').oninput = e=>{ s.name = e.target.value; dirty(); renderKkNav(); };
    $('#kWhere').oninput = e=>{ s.where = e.target.value; dirty(); };
    document.querySelectorAll('[data-ktype]').forEach(b=>b.onclick=()=>{ s.type = b.dataset.ktype; dirty(); renderKk(); });
  } else if (st.id==='klar'){
    document.querySelectorAll('[data-final]').forEach(b=>b.onclick=()=>{ s.final = b.dataset.final; dirty(); renderKk(); });
    $('#kMotiv').oninput = e=>{ s.motiv = e.target.value; save(); };
    $('#kCopy').onclick = ()=>copyRich(null, $('#kMotiv').value);
    $('#kRegen').onclick = ()=>{ s.motiv = null; save(); $('#kMotiv').value = motivFor(s); toast(Lt('Texten är skapad igen','The text has been made again')); };
    $('#kSend').onclick = ()=>{
      const o = {name:s.name}; CRIT.forEach(([k])=>o[k] = s.v[k] || '');
      const j = state.sources.findIndex(x=>x.kk===s.id || x.name===s.name); o.kk = s.id;
      if (j>=0) state.sources[j] = o; else state.sources.push(o);
      s.sent = true; save(); renderKk(); toast(Lt('Finns nu i Skrivstödet under Källor och källkritik','Now in Skrivstödet under Sources'));
    };
    $('#kNew').onclick = ()=>{ newKk(); renderKk(); window.scrollTo({top:0}); };
    $('#kDel').onclick = ()=>{ $('#kDelConfirm').hidden = false; };
    $('#kDelNo').onclick = ()=>{ $('#kDelConfirm').hidden = true; };
    $('#kDelYes').onclick = ()=>{ state.kk = state.kk.filter(x=>x!==s); state.kkSel = ''; save(); renderKk(); toast(Lt('Granskningen är borttagen','The check has been deleted')); };
  } else {
    const f = KK_Q[st.id].field[0];
    document.querySelectorAll('[data-kc]').forEach(cb=>cb.onchange=()=>{ const a = s.c[st.id] || []; a[+cb.dataset.kc] = cb.checked; s.c[st.id] = a; save(); });
    document.querySelectorAll('input[name="khand"]').forEach(r=>r.onchange=()=>{ s.hand = r.value; dirty(); });
    document.querySelectorAll('input[name="kpur"]').forEach(r=>r.onchange=()=>{ s.purpose = r.value; dirty(); });
    $('#kField').oninput = e=>{ s.f[f] = e.target.value; dirty(); };
    document.querySelectorAll('[data-verd]').forEach(b=>b.onclick=()=>{ s.v[st.id] = s.v[st.id]===b.dataset.verd ? '' : b.dataset.verd; dirty(); document.querySelectorAll('[data-verd]').forEach(x=>x.setAttribute('aria-pressed', String(s.v[st.id]===x.dataset.verd))); });
  }
}

  const css = Object.entries(MTAGS).map(([k,v])=> v.c ? `.mt-${k}{background:${v.c};border-radius:3px}.mtext[data-focus="${k}"] .mt-${k}{background:${v.c}}` : `.mt-${k}{border-bottom:2px solid var(--accent)}.mtext[data-focus="${k}"] .mt-${k}{border-bottom:2px solid var(--accent)}`).join('')
    + Object.entries(MTAGS).map(([k,v])=>`.mleg i.mt-${k}{${v.c?'background:'+v.c:'border-bottom:3px solid var(--accent);background:var(--surface)'}}`).join('')
    + Object.entries(MTAGS).filter(([,v])=>v.c).map(([k])=>`[data-theme="dark"] .mtext[data-focus="${k}"] .mt-${k}{color:#1d2731}`).join('');
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
})();
document.querySelectorAll('[data-prog]').forEach(b=>b.onclick=()=>{ state.prog=b.dataset.prog; save(); renderControls(); renderStep(); });
$('#textsort').onchange=e=>{ if (lockedTs()) return; state.textsort=e.target.value; save(); renderStep(); };
$('#refsys').onchange=e=>{ if (lockedRef()) return; state.refsys=e.target.value; save(); renderStep(); };
$('#langSel').onchange=e=>{ state.lang=e.target.value; save(); renderAll(); };
$('#levelSel').onchange=e=>{ state.level=e.target.value; if (state.level==='easy') state.gloss=true; save(); renderAll(); };
$('#themeBtn').onclick=()=>{ state.theme = theme()==='dark' ? 'light' : 'dark'; save(); renderControls(); };
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if (!state.theme) renderControls(); }); }catch(e){}
$('#bigger').onclick=()=>{ state.size=Math.min(140,state.size+10); save(); renderControls(); };
$('#smaller').onclick=()=>{ state.size=Math.max(90,state.size-10); save(); renderControls(); };
$('#saveBtn').onclick=openSave; $('#privBtn').onclick=openPrivacy; $('#glossBtn').onclick=openGloss; $('#taskBtn').onclick=openTaskPanel; $('#teacherBtn').onclick=openTeacher;
$('#overlay').onclick=e=>{ if(e.target.id==='overlay') closePanel(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('#overlay').hidden) closePanel(); });
if (EMBED){ applyTask(EMBED); if (!load()?.tool) state.tool='skriv'; }
renderAll();

</script>
